name: Bootstrap AIBeautyCamera source

on:
  push:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 .bootstrap/part03 .bootstrap/part04a > /tmp/a.b64
          cat .bootstrap/part04h0_* .bootstrap/part04hex1_* | tr -d '\n\r ' | xxd -r -p >> /tmp/a.b64
          base64 -d /tmp/a.b64 > /tmp/a.zip
          unzip -t /tmp/a.zip
          mkdir -p /tmp/a
          unzip -q /tmp/a.zip -d /tmp/a
          cp -a /tmp/a/AIBeautyCamera/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Import AIBeautyCamera v1.4.5 source"
          git push origin HEAD:main
